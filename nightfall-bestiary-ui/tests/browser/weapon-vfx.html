<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长夜 · 武器特效预览</title><style>*{box-sizing:border-box}body{margin:0;background:#0b151b;color:#d8e4cb;font:13px system-ui}header{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid #33413d}header strong{letter-spacing:3px;margin-right:auto}button,select{background:#1c2a2c;color:#d6e3ca;border:1px solid #455750;border-radius:6px;padding:7px 11px;font:inherit}canvas{display:block;width:100vw;height:calc(100vh - 58px);image-rendering:pixelated}output{font-variant-numeric:tabular-nums;color:#a4b8ae;min-width:80px}@media(max-width:600px){header{gap:5px;padding:0 8px}header strong{font-size:11px;letter-spacing:1px}button,select{padding:5px;font-size:11px}output{display:none}}</style><header><strong>NIGHTFALL</strong><select aria-label="攻击类型"><option value="zmd">zmd科技</option><option value="dijiang">帝江号轨道炮</option><option value="pelican">佩丽卡电锯</option><option value="spells">元素法术</option><option value="ranged">远程武器</option><option value="melee">近战武器</option><option value="machines">机关武器</option><option value="artifacts">神器</option><option value="newArtifacts">组合神器</option><option value="ritual">仪式兵装</option><option value="ritualArtifacts">仪式神器</option></select><button id="pause">暂停</button><button id="step">步进</button><output>加载中</output></header><canvas aria-label="武器特效实战预览"></canvas><script type="module">
import {World,Renderer} from '/lib/game.mjs';import {RECIPES} from '/lib/equipment.mjs';
const renderer=new Renderer(document.querySelector('canvas')),out=document.querySelector('output'),selector=document.querySelector('select'),pause=document.querySelector('#pause');
const sets={zmd:['zmd'],dijiang:['dijiang'],pelican:['pelican'],ritual:['bell','gauntlet','hourglass','bloodneedle','loom','flail'],ritualArtifacts:['requiem','bloodfist','stormloom'],spells:['nova','storm','ember','sigil','prism','wind'],ranged:['blade','dagger','chakram','bow','spear','familiar'],melee:['orbit','axe','scythe','whip','chain','saw'],machines:['mine','turret','saw','chain','wind','prism'],artifacts:['solar','inferno','reaper','thunderbow','void','seraph'],newArtifacts:['mirrordance','bastion','soulmill','typhoon','eclipse','winter']};let w,paused=false,last=0;
function reset(){w=new World([{id:'solo',weapon:'blade'}],()=>.42);const p=w.s.players[0];p.ranks={};p.count=p.orbit=p.nova=p.storm=0;p.hp=p.maxHp=1e8;p.damage=9;w.spawnCd=1e8;w.eliteAt=1e8;w.s.nextBossAt=1e8;
 for(const key of sets[selector.value]){const r=RECIPES.find(r=>r.key===key);if(r){for(const part of r.weapons||[{key:r.weapon,level:5},{key:r.item,level:1}])p.ranks[part.key]=part.level;p.relics++;w.craft(p.id,key);}else p.ranks[key]=4;}
 for(const key of ['orbit','nova','storm'])p[key]=p.ranks[key]||0;p.count=p.ranks.blade||0;p.novaCd=p.stormCd=0;w.s.effects=[];
 for(let i=0;i<28;i++){const type=i%9===0?6:i%5===0?3:i%4===0?2:1,e=w.spawn(type,0),a=i*2.4,radius=85+(i%6)*46;e.x=p.x+Math.cos(a)*radius;e.y=p.y+Math.sin(a)*radius;e.hp=e.maxHp=1e7;e.speed=12;e.skillCd=1e8;}
 out.textContent='00:00';}
function advance(dt){const p=w.s.players[0];p.choices=[];p.hp=p.maxHp;w.step(dt);renderer.render(w.s,'solo',dt);renderer.feedback.sounds=[];out.textContent=w.s.time.toFixed(2)+' s';}
selector.onchange=()=>{reset();advance(.016);};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续':'暂停';};document.querySelector('#step').onclick=()=>{if(!paused){paused=true;pause.textContent='继续';}for(let i=0;i<3;i++)advance(.05);};
if(new URLSearchParams(location.search).has('weapon'))selector.value=new URLSearchParams(location.search).get('weapon');
try{await Promise.all([renderer.arena,renderer.atlas,renderer.actors,renderer.foes,renderer.walk,renderer.hitAtlas,renderer.relicAtlas,renderer.weaponAtlas,renderer.vfxAtlas,renderer.bestiary,renderer.uiAtlas,renderer.frontierAtlas].map(im=>im.decode()));reset();requestAnimationFrame(function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;if(!paused)advance(dt);requestAnimationFrame(frame);});}catch(e){out.textContent='FAIL: '+e.message;console.error(e);}
</script></html>
