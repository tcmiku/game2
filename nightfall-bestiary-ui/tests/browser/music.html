<!doctype html><html lang="zh"><meta charset="utf-8"><title>NIGHTFALL 原生音频验证</title><style>body{background:#14202c;color:#e7d4af;font:16px system-ui;padding:32px}button{padding:18px;margin:8px}pre{line-height:1.8}</style><h1>原创 8bit 配乐</h1><button id="camp">营地 · 余火轻眠</button><button id="battle">战斗 · 逐月行军</button><button id="mute">静音</button><button id="check">验证两首音轨</button><pre id="result">等待播放</pre><script type="module">
import {AudioBus} from '/lib/game.mjs';import {ChipMusic,SCORES,scoreStep} from '/lib/music.mjs';
const bus=new AudioBus(),out=document.querySelector('#result');
for(const scene of ['camp','battle'])document.querySelector('#'+scene).onclick=()=>{bus.init();bus.setScene(scene);out.textContent=`${SCORES[scene].name} · ${SCORES[scene].bpm} BPM`;};
document.querySelector('#mute').onclick=()=>{bus.enabled=!bus.enabled;out.textContent='声音 '+(bus.enabled?'开启':'静音');};
document.querySelector('#check').onclick=async()=>{try{for(const [scene,score]of Object.entries(SCORES)){const rate=22050,seconds=128*60/score.bpm/2,ctx=new OfflineAudioContext(1,Math.ceil(seconds*rate),rate),music=new ChipMusic(ctx);music.channel=ctx.createGain();music.channel.connect(music.master);for(let i=0;i<128;i++)for(const note of scoreStep(scene,i))music.note(note,i*60/score.bpm/2);const buffer=await ctx.startRendering(),data=buffer.getChannelData(0);let peak=0,energy=0;for(const v of data){if(!Number.isFinite(v))throw Error('non-finite audio');peak=Math.max(peak,Math.abs(v));energy+=v*v;}if(peak<=.01||peak>=1)throw Error('silent or clipped audio');music.dispose();out.textContent+=`\nPASS ${scene}: ${seconds.toFixed(2)}s · peak ${peak.toFixed(3)} · RMS ${Math.sqrt(energy/data.length).toFixed(3)}`;}}catch(e){out.textContent='FAIL '+e.stack;console.error(e);}};
window.addEventListener('pagehide',()=>bus.dispose());
</script></html>
